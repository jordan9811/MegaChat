<!DOCTYPE html>
<html>
<head>
  <title>Stream Overlay</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* MegaChat design system (neon-noir) — matches web/app/globals.css tokens. */
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
    :root {
      --neon-magenta: oklch(0.68 0.27 340);
      --neon-lime: oklch(0.88 0.22 128);
      --neon-cyan: oklch(0.8 0.14 200);
      --noir-ink: rgba(10, 7, 18, 0.78);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* OBS browser source: fully transparent canvas. Only live tiles paint. */
    html, body {
      background: transparent;
    }
    body {
      overflow: hidden;
      font-family: 'Space Grotesk', Arial, sans-serif;
    }

    /* Transparent, shrink-wrapped column anchored top-right. No background, no
       border, no min size — it sizes to the tiles actually present, and when
       empty nothing is drawn at all (the game shows through). */
    #stage {
      position: fixed;
      top: 20px;
      right: 20px;
      background: transparent;
      /* width/height are set from JS (TILE_W and the live tile count). */
    }

    /* One fixed-size tile per live participant. Absolutely positioned so the
       remaining tiles can smoothly slide up when one is removed. */
    .tile {
      position: absolute;
      right: 0;
      background: transparent;        /* no opaque backdrop */
      border-radius: 10px;
      overflow: hidden;
      transform-origin: center center;
      /* Broadcast-clean neon chrome: hairline magenta edge + faint cyan halo.
         Subtle on purpose — this sits over live gameplay. */
      border: 1px solid color-mix(in oklab, var(--neon-magenta) 45%, transparent);
      box-shadow:
        0 0 0 1px color-mix(in oklab, var(--neon-cyan) 16%, transparent),
        0 6px 22px rgba(0, 0, 0, 0.35);
      /* CHANGE 3 — slide-up reflow: animating `top` closes the gap smoothly. */
      transition: top 300ms cubic-bezier(.2, .8, .2, 1);
      will-change: top, clip-path, transform, opacity;
    }

    .tile iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
      background-color: transparent;  /* no dark fill on the iframe element itself */
    }

    /* White layer used only for the CRT power-off flash. */
    .crt-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Pinned co-host badge — top-left, quiet lime chip. */
    .pin-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--noir-ink);
      color: var(--neon-lime);
      border: 1px solid color-mix(in oklab, var(--neon-lime) 55%, transparent);
      border-radius: 4px;
      padding: 3px 8px;
      font: 700 10px/1 'Space Grotesk', Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 10;
      pointer-events: none;
      display: none;
    }
    .tile.pinned .pin-badge { display: block; }

    /* Name chip: noir glass slab with a magenta accent bar and a whisper of
       chromatic aberration on the text — MegaChat glitch energy, kept quiet. */
    .username-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: var(--noir-ink);
      color: #f4f2fa;
      padding: 4px 10px 4px 12px;
      border-radius: 4px;
      border-left: 3px solid var(--neon-magenta);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
      font-family: 'Space Grotesk', Arial, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow:
        1px 0 color-mix(in oklab, var(--neon-cyan) 55%, transparent),
        -1px 0 color-mix(in oklab, var(--neon-magenta) 45%, transparent);
      z-index: 10;
      pointer-events: none;
      max-width: calc(100% - 16px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHANGE 4 — JOIN: heart-rate-monitor blip (a thin bright horizontal line)
       that then expands outward into the full tile. */
    .tile.joining { animation: tileJoin 650ms cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes tileJoin {
      0%   { clip-path: inset(50% 0% 50% 0%); opacity: .35;
             box-shadow: 0 0 16px 3px rgba(0,255,255,.9); filter: brightness(1.7); }
      14%  { clip-path: inset(49% 0% 49% 0%); opacity: 1;
             box-shadow: 0 0 28px 8px rgba(0,255,255,1); }   /* bright blip line */
      26%  { clip-path: inset(44.5% 0% 44.5% 0%); }          /* first beat */
      36%  { clip-path: inset(48.5% 0% 48.5% 0%); }          /* heartbeat dip */
      46%  { clip-path: inset(43% 0% 43% 0%); }              /* second beat */
      100% { clip-path: inset(0% 0% 0% 0%); opacity: 1;
             box-shadow: 0 0 0 0 rgba(0,255,255,0); filter: brightness(1); }
    }

    /* CHANGE 5 — LEAVE: retro CRT power-off. Collapse to a bright line, white
       flash, then blink out to nothing. Reflow runs AFTER this completes.
       NOTE: `.leaving` is only a marker (layout code keys on it); the default
       exit animation is applied via `.out-default` below. */
    .tile.leaving { pointer-events: none; }
    .tile.out-default { animation: crtOff 460ms ease-in forwards; }
    @keyframes crtOff {
      0%   { clip-path: inset(0 0 0 0); transform: scale(1); filter: brightness(1); }
      40%  { clip-path: inset(46% 0 46% 0); transform: scale(1); filter: brightness(1.6); }
      62%  { clip-path: inset(49.4% 0 49.4% 0); filter: brightness(3.2); }   /* thin line */
      80%  { clip-path: inset(49.4% 43% 49.4% 43%); transform: scaleX(.5); } /* line -> dot */
      100% { clip-path: inset(50% 50% 50% 50%); transform: scale(.15); opacity: 0; }
    }
    .tile.out-default .crt-flash { animation: crtFlash 460ms ease-in forwards; }
    @keyframes crtFlash {
      0%, 38% { opacity: 0; }
      60%     { opacity: .95; }   /* white flash on the collapsing line */
      100%    { opacity: 0; }
    }

    /* ═══ STINGERS — pure CSS, each ≤1.5s, opt-in from the join page. ═══════
       `.leaving` is a pure MARKER class (layout code keys on it); the actual
       exit animation lives on out-* classes. Default in/out remain the
       original tileJoin / crtOff (out-default, declared above). */
    .stinger-fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

    /* ── Lazy connect: reveal gating (see LIVEKIT-AUDIT.md) ──────────────────
       The seat FRAME is always rendered — only the video texture swaps in.
       A tile holds until its track arrives AND its stinger passes the reveal
       frame, so an empty video hole is never on screen. */
    .tile.lk-holding > video { opacity: 0; }
    /* ENTRY reveal is INSTANT and deliberately un-animated: the stinger is the
       only transition on this path. A fade here would stack two transitions
       and read as a stutter at the wipe edge. */
    .tile > video.lk-revealed { opacity: 1; }
    /* Hold state: a faint branded breath on the frame so a late track reads as
       intentional rather than broken. Only ever visible if the stinger
       finished before the track landed. */
    .tile.lk-holding::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(120% 120% at 50% 40%,
        color-mix(in oklab, var(--neon-violet) 22%, transparent), transparent 70%);
      animation: lk-hold-breath 1.6s ease-in-out infinite alternate;
      pointer-events: none; z-index: 1;
    }
    @keyframes lk-hold-breath { from { opacity: .35; } to { opacity: .7; } }
    /* NON-ENTRY only (reconnect / track restart / camera toggle). Never
       attached to a first entry — that path belongs to the stinger. */
    @keyframes lk-refade { from { opacity: 0; } to { opacity: 1; } }
    .tile > video.lk-refade { animation: lk-refade 200ms ease-out; }

    /* Overlay status pin — for the STREAMER's eye only, never a broadcast
       element. Tiny, corner-parked, and invisible while everything is fine. */
    #lk-status {
      position: fixed; right: 6px; bottom: 6px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #666; opacity: .35; z-index: 999; pointer-events: none;
      transition: background .3s ease, opacity .3s ease;
    }
    #lk-status[data-state="live"]  { background: var(--neon-lime); opacity: .28; }
    #lk-status[data-state="waking"]{ background: var(--neon-cyan); opacity: .5;
      animation: lk-hold-breath .8s ease-in-out infinite alternate; }
    #lk-status[data-state="error"] { background: var(--neon-magenta); opacity: .85;
      animation: lk-hold-breath .6s ease-in-out infinite alternate; }
    /* ── Creator bounty: proof-of-broadcast watermark ────────────────────────
       Deliberately its OWN persistent element rather than a decoration inside
       a MegaChat tile. A letter tile exists for ~10s at a time; a code that
       rotates every 60s would almost never be on screen when the verifier
       samples a frame, so tying the watermark to tile lifetime would fail
       honest streamers. This sits outside #stage entirely and never touches
       the tile/stinger machinery.

       Legibility rules, because this gets read back off a downscaled and
       re-compressed stream frame: high contrast, solid backing plate (never
       over live video), generous letter-spacing, tabular glyphs, and NO
       animation on the code itself — a mid-transition frame must still read. */
    #bounty-badge {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 40;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 6px;
      border-left: 3px solid var(--neon-lime);
      background: #08060f;            /* opaque on purpose — no video behind */
      color: #ffffff;
      font-family: 'Space Grotesk', Arial, sans-serif;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
    #bounty-badge.show { display: inline-flex; }
    #bounty-badge .bb-mark {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--neon-lime);
    }
    #bounty-badge .bb-code {
      font-family: 'Courier New', monospace;
      font-size: 22px;
      letter-spacing: .18em;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      text-shadow: none;              /* nothing that could smear under encode */
    }
    /* Streamer-facing warning. Shown only in the OBS preview sense — it is
       intentionally legible, because a silent failure here costs them money. */
    #bounty-badge.too-small {
      border-left-color: var(--neon-magenta);
    }
    #bounty-badge.too-small .bb-code {
      font-size: 13px;
      color: var(--neon-magenta);
    }

    /* IN 1 — STORM: cloud bank rolls over, double lightning strike reveals. */
    .tile.in-storm { animation: stormReveal 1400ms ease-out both; }
    @keyframes stormReveal {
      0%   { opacity: 0; filter: brightness(0.2) saturate(0.4); }
      45%  { opacity: .55; filter: brightness(0.35) saturate(0.5); }
      52%  { opacity: 1; filter: brightness(2.6) saturate(1.4) contrast(1.3); } /* strike 1 */
      58%  { opacity: .75; filter: brightness(0.5); }
      66%  { opacity: 1; filter: brightness(3.2) contrast(1.5); }               /* strike 2 */
      74%  { filter: brightness(0.9); }
      100% { opacity: 1; filter: brightness(1) saturate(1); }
    }
    .fx-storm { overflow: hidden; }
    .fx-storm::before { /* rolling cloud bank */
      content: ''; position: absolute; inset: -40% -20%;
      background:
        radial-gradient(38% 55% at 22% 28%, rgba(24,20,38,.95), transparent 70%),
        radial-gradient(45% 60% at 55% 18%, rgba(16,13,28,.92), transparent 70%),
        radial-gradient(40% 50% at 82% 30%, rgba(28,22,44,.95), transparent 70%),
        radial-gradient(60% 70% at 50% 55%, rgba(12,10,22,.85), transparent 75%);
      animation: stormClouds 1400ms ease-in-out both;
    }
    @keyframes stormClouds {
      0%   { transform: translateY(-110%); opacity: 1; }
      35%  { transform: translateY(0); opacity: 1; }
      70%  { transform: translateY(6%); opacity: .9; }
      100% { transform: translateY(115%); opacity: 0; }
    }
    .fx-storm::after { /* lightning bolt */
      content: ''; position: absolute; top: 0; bottom: 0; left: 44%; width: 14%;
      background: linear-gradient(178deg, #fff, var(--neon-cyan) 60%, transparent);
      clip-path: polygon(48% 0, 62% 0, 40% 42%, 58% 42%, 22% 100%, 38% 55%, 20% 55%);
      opacity: 0; filter: drop-shadow(0 0 8px var(--neon-cyan));
      animation: stormBolt 1400ms linear both;
    }
    @keyframes stormBolt {
      0%, 48%  { opacity: 0; }
      52%, 55% { opacity: 1; }
      58%      { opacity: 0; }
      64%, 67% { opacity: .9; transform: translateX(18%) scaleX(-1); }
      70%, 100% { opacity: 0; }
    }

    /* IN 2 — PRO ROLL: clean edge-lit wipe, broadcast-grade. */
    .tile.in-proroll { animation: prorollReveal 900ms cubic-bezier(.25,.9,.3,1) both; }
    @keyframes prorollReveal {
      0%   { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }
    .fx-proroll::before { /* leading light bar */
      content: ''; position: absolute; top: -4%; bottom: -4%; width: 4px; left: 0;
      background: linear-gradient(var(--neon-cyan), #fff, var(--neon-magenta));
      box-shadow: 0 0 14px 2px color-mix(in oklab, var(--neon-cyan) 70%, transparent);
      animation: prorollBar 900ms cubic-bezier(.25,.9,.3,1) both;
    }
    @keyframes prorollBar {
      0%   { left: 0; opacity: 1; }
      92%  { opacity: 1; }
      100% { left: calc(100% - 4px); opacity: 0; }
    }

    /* IN 3 — CALL ME: beeper pop-in with bounce, wiggle and comm rings. */
    .tile.in-callme { animation: callmePop 1200ms cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes callmePop {
      0%   { transform: scale(.25) rotate(-4deg); opacity: 0; }
      38%  { transform: scale(1.06) rotate(2.5deg); opacity: 1; }
      52%  { transform: scale(.97) rotate(-2deg); }
      64%  { transform: scale(1.02) rotate(1.2deg); }
      76%  { transform: scale(.995) rotate(-.6deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .fx-callme::before, .fx-callme::after { /* expanding comm rings */
      content: ''; position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
      margin: -20px 0 0 -20px; border-radius: 50%;
      border: 2px solid var(--neon-lime); opacity: 0;
    }
    .fx-callme::before { animation: callmeRing 600ms ease-out 80ms 2; }
    .fx-callme::after  { animation: callmeRing 600ms ease-out 280ms 2; }
    @keyframes callmeRing {
      0%   { transform: scale(.4); opacity: .9; }
      100% { transform: scale(4.2); opacity: 0; }
    }

    /* IN 4 — BREAKING NEWS: banner slam + hard drop-in. */
    .tile.in-breaking { animation: breakingSlam 1300ms cubic-bezier(.2,1.1,.3,1) both; }
    @keyframes breakingSlam {
      0%   { transform: translateY(-130%) ; opacity: 0; }
      34%  { transform: translateY(0); opacity: 1; filter: brightness(1.7); }
      42%  { transform: translateY(-3%); filter: brightness(1); }
      50%  { transform: translateY(0); }
      100% { transform: translateY(0); opacity: 1; }
    }
    .fx-breaking::before { /* alert banner strip */
      content: '● LIVE — BREAKING'; position: absolute; left: -6%; right: -6%;
      top: 38%; height: 24%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(90deg, var(--neon-magenta), oklch(0.55 0.24 25));
      color: #fff; font: 700 13px/1 'Space Grotesk', sans-serif;
      letter-spacing: .18em; text-transform: uppercase;
      transform: translateX(-120%) skewX(-12deg);
      box-shadow: 0 0 18px rgba(0,0,0,.5);
      animation: breakingBanner 1300ms cubic-bezier(.6,0,.2,1) both;
    }
    @keyframes breakingBanner {
      0%   { transform: translateX(-120%) skewX(-12deg); }
      28%  { transform: translateX(0) skewX(-12deg); }
      64%  { transform: translateX(0) skewX(-12deg); opacity: 1; }
      100% { transform: translateX(125%) skewX(-12deg); opacity: 0; }
    }

    /* IN 5 — WILD CARD "GLITCH MATERIALIZE": sliced RGB-split assembly. */
    .tile.in-wildin { animation: wildinGlitch 1400ms steps(1, end) both; }
    @keyframes wildinGlitch {
      0%   { opacity: 0; }
      8%   { opacity: 1; clip-path: inset(0 0 78% 0); transform: translateX(-6px); filter: hue-rotate(90deg) saturate(3); }
      18%  { clip-path: inset(30% 0 40% 0); transform: translateX(5px); filter: hue-rotate(-70deg) contrast(1.6); }
      30%  { clip-path: inset(62% 0 8% 0); transform: translateX(-4px); filter: saturate(2.4); }
      42%  { clip-path: inset(12% 0 55% 0); transform: translateX(3px); filter: hue-rotate(45deg); }
      54%  { clip-path: inset(0 0 0 0); transform: translateX(-2px); filter: contrast(1.4) saturate(1.6); }
      68%  { transform: translateX(1px); filter: none; }
      100% { opacity: 1; clip-path: inset(0 0 0 0); transform: none; filter: none; }
    }
    .fx-scanline::before { /* single bright scan sweep */
      content: ''; position: absolute; left: 0; right: 0; height: 3px; top: 0;
      background: linear-gradient(90deg, transparent, var(--neon-lime), transparent);
      box-shadow: 0 0 12px 1px color-mix(in oklab, var(--neon-lime) 60%, transparent);
      animation: scanSweep 1400ms linear both;
    }
    @keyframes scanSweep {
      0%   { top: 0; opacity: 1; }
      85%  { opacity: 1; }
      100% { top: calc(100% - 3px); opacity: 0; }
    }

    /* OUT 1 — CRT OFF (improved): scanline squeeze, phosphor line linger,
       bloom dot pop. */
    .tile.out-crt { animation: crtOff2 800ms ease-in forwards; pointer-events: none; }
    @keyframes crtOff2 {
      0%   { clip-path: inset(0 0 0 0); filter: brightness(1); }
      34%  { clip-path: inset(42% 0 42% 0); filter: brightness(1.5) saturate(1.3); }
      48%  { clip-path: inset(49.2% 0 49.2% 0); filter: brightness(3.5); }
      68%  { clip-path: inset(49.4% 0 49.4% 0); filter: brightness(4) blur(.4px); } /* phosphor linger */
      82%  { clip-path: inset(49.5% 46% 49.5% 46%); filter: brightness(5); }
      92%  { clip-path: inset(49.6% 49.4% 49.6% 49.4%); transform: scale(1.02); filter: brightness(6) blur(1px); }
      100% { clip-path: inset(50% 50% 50% 50%); opacity: 0; }
    }
    .tile.out-crt .crt-flash { animation: crtFlash2 800ms ease-in forwards; }
    @keyframes crtFlash2 {
      0%, 30% { opacity: 0; }
      46%     { opacity: .9; }
      60%     { opacity: .25; }
      74%     { opacity: .6; }   /* phosphor re-glow */
      100%    { opacity: 0; }
    }

    /* OUT 2 — CRUMBLE: jagged collapse downward with a tilt and dust drop. */
    .tile.out-crumble { animation: crumbleFall 1200ms ease-in forwards; pointer-events: none; }
    @keyframes crumbleFall {
      0%   { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transform: none; }
      18%  { clip-path: polygon(0 6%, 18% 0, 38% 7%, 61% 1%, 82% 8%, 100% 3%, 100% 100%, 0 100%); transform: rotate(.6deg); }
      38%  { clip-path: polygon(0 24%, 15% 15%, 36% 26%, 58% 17%, 79% 27%, 100% 20%, 100% 100%, 0 100%); transform: rotate(-.8deg) translateY(3%); }
      58%  { clip-path: polygon(0 48%, 17% 38%, 39% 51%, 60% 41%, 83% 52%, 100% 44%, 100% 100%, 0 100%); transform: rotate(1deg) translateY(9%); }
      78%  { clip-path: polygon(0 74%, 16% 66%, 37% 78%, 62% 69%, 81% 80%, 100% 72%, 100% 100%, 0 100%); transform: rotate(-.7deg) translateY(18%); opacity: .85; }
      100% { clip-path: polygon(0 100%, 20% 98%, 40% 100%, 60% 99%, 80% 100%, 100% 99%, 100% 100%, 0 100%); transform: translateY(30%); opacity: 0; }
    }

    /* OUT 3 — ZAPPED: freeze, electrocution invert/glitch, drift away. */
    .tile.out-zapped { animation: zappedOut 1100ms linear forwards; pointer-events: none; }
    @keyframes zappedOut {
      0%, 12% { filter: none; transform: none; }
      16%  { filter: invert(1) contrast(2); transform: translateX(-3px); }
      22%  { filter: invert(0) saturate(3) hue-rotate(120deg); transform: translateX(3px); }
      28%  { filter: invert(1) contrast(2.4) brightness(1.6); transform: translateX(-2px) skewX(2deg); }
      36%  { filter: invert(0) hue-rotate(-100deg) saturate(2.5); transform: translateX(2px); }
      44%  { filter: invert(1) brightness(2); transform: skewX(-2deg); }
      56%  { filter: invert(.85) contrast(1.8) brightness(1.4); transform: none; }
      100% { filter: invert(.9) brightness(.1) blur(6px); opacity: 0; transform: scale(.96); }
    }

    /* OUT 4 — WILD CARD "SIGNAL LOST": RGB split, vertical roll, band snap. */
    .tile.out-wildout { animation: signalLost 1000ms steps(1, end) forwards; pointer-events: none; }
    @keyframes signalLost {
      0%   { filter: none; }
      14%  { filter: drop-shadow(3px 0 0 color-mix(in oklab, var(--neon-cyan) 80%, transparent))
                     drop-shadow(-3px 0 0 color-mix(in oklab, var(--neon-magenta) 80%, transparent)); }
      28%  { clip-path: inset(0 0 0 0); transform: translateY(-8%); filter: contrast(1.6) saturate(.4); }
      42%  { transform: translateY(7%); filter: contrast(2) saturate(.2) brightness(1.3); }
      56%  { transform: translateY(-4%); clip-path: inset(12% 0 12% 0); filter: saturate(0) contrast(2.2); }
      72%  { transform: none; clip-path: inset(46% 0 46% 0); filter: brightness(2.6) saturate(0); }
      86%  { clip-path: inset(49.4% 0 49.4% 0); filter: brightness(4); }
      100% { clip-path: inset(50% 0 50% 0); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <!-- Overlay health pin: an 8px dot for the STREAMER to glance at in the OBS
       source preview. Never a broadcast element — dim grey when idle, brief
       cyan while waking, faint lime when live, and only loud (magenta) on
       error, which is the one state worth interrupting for. -->
  <div id="lk-status" data-state="idle" aria-hidden="true"></div>
  <!-- Creator bounty watermark. Hidden entirely unless the overlay URL carries
       ?bounty=<airSessionId>, so a normal room renders exactly as before. -->
  <div id="bounty-badge" aria-hidden="true">
    <span class="bb-mark">MEGACHAT</span>
    <span class="bb-code" id="bounty-code"></span>
  </div>

  <script>
    // ─── Layout config ───────────────────────────────────────────────────────
    const TILE_W = 320;    // tile width  (px)
    const TILE_H = 180;    // tile height (px)
    const GAP = 12;        // vertical gap between stacked tiles (px)
    const MAX_SEATS = 3;   // never render more than this many tiles
    const CRT_MS = 460;    // CHANGE 5 leave animation duration
    const JOIN_MS = 700;   // CHANGE 4 join animation duration

    let streamRoomId = 'default';
    try {
      const q = new URLSearchParams(location.search).get('room');
      if (q && /^[a-z0-9-]{1,32}$/i.test(q)) streamRoomId = q.toLowerCase();
    } catch { /* default */ }

    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProto}//${location.host}`);
    const stage = document.getElementById('stage');
    stage.style.width = TILE_W + 'px';
    const videoBoxes = new Map(); // seatId -> tile element (insertion order)

    // Build a direct vdo.ninja VIEW url for OBS overlay tiles.
    //
    // The server sends viewUrl with &scene (generateVDORoom). Scene mode applies
    // mixer layouts — portrait slots, holder letterboxing, UI chrome — which is
    // exactly the dark-navy bands + pause/bitrate controls in the screenshot.
    // Overlay must use a plain ?view=STREAMID link instead (docs: view.md).
    //
    // Documented params appended here:
    //   transparent, cleanviewer, cleanoutput  — transparent page, no UI chrome
    //   cover                                   — crop to fill window (cover.md)
    //   structure                               — 16:9 holder matching our tile (and-structure.md)
    //   hideplaybutton, obsoff                  — hide play btn / tally (viewer-side)
    //   viewwidth/viewheight                    — match tile px (and-viewheight.md)
    //   css                                     — inline transparent holder + object-fit cover
    function extractViewStreamId(baseUrl) {
      try {
        const view = new URL(baseUrl).searchParams.get('view');
        if (view) return view.split(',')[0].trim();
      } catch { /* fall through */ }
      const m = baseUrl.match(/[?&]view=([^&]+)/i);
      return m ? decodeURIComponent(m[1]).split(',')[0].trim() : null;
    }

    function buildOverlayViewUrl(baseUrl) {
      const streamId = extractViewStreamId(baseUrl);
      let origin = 'https://vdo.ninja';
      try { origin = new URL(baseUrl).origin; } catch { /* default */ }
      if (!streamId) return baseUrl; // nothing to rewrite

      // Inline CSS via documented &css param (design-parameters/css).
      const css = [
        ':root{--video-holder-color:transparent!important}',
        'body,html{background:transparent!important;background-color:transparent!important}',
        'video,canvas{object-fit:cover!important;width:100%!important;height:100%!important}',
        '#container,#grid,#videos,.vidcon,.video-container,.videoContainer,#videoContainer',
        '{width:100%!important;height:100%!important;margin:0!important;padding:0!important;background:transparent!important}',
        '#controls,#playbutton,#header,#menu,#bottombar,#topbar,.controls,#miniPreview,#whip,#stats,#bitrate,.bitrate,#milestone,.pause,#pausebutton,.pause-button',
        '{display:none!important;opacity:0!important;visibility:hidden!important}',
      ].join('');

      const q = [
        `view=${encodeURIComponent(streamId)}`,
        'transparent',
        'cleanviewer',
        'cleanoutput',
        'cover',
        'structure',
        'hideplaybutton',
        'obsoff',
        'muted',
        'autostart',
        // Resilience on shaky viewer uplinks: a little playout buffer smooths
        // jitter instead of hard-dropping frames, and failed connections
        // retry fast (vdo.ninja ignores params it doesn't know).
        'buffer=300',
        'retrytimeout=2000',
        `viewwidth=${TILE_W}`,
        `viewheight=${TILE_H}`,
        `css=${encodeURIComponent(css)}`,
      ].join('&');
      // Plain direct view — intentionally NO &scene (mixer layout breaks overlay).
      return `${origin}/?${q}`;
    }

    // IFRAME API style injection — backup in case &css loads late. Best-effort.
    function injectVdoOverlayStyles(iframe) {
      const send = () => {
        try {
          iframe.contentWindow?.postMessage({
            style: [
              ':root { --video-holder-color: transparent !important; }',
              'body, html { background: transparent !important; background-color: transparent !important; }',
              'video, canvas { object-fit: cover !important; width: 100% !important; height: 100% !important; }',
              '#container, #grid, #videos, .vidcon, .video-container, .videoContainer {',
              '  width: 100% !important; height: 100% !important; margin: 0 !important;',
              '  padding: 0 !important; background: transparent !important; }',
              '#controls, #playbutton, #header, #menu, #bottombar, .controls, #stats, .bitrate, .pause-button {',
              '  display: none !important; visibility: hidden !important; }',
            ].join('\n'),
          }, '*');
        } catch { /* ignore */ }
      };
      iframe.addEventListener('load', send);
      setTimeout(send, 1200);
      setTimeout(send, 3500);
    }

    // ─── LiveKit transport (flag-gated; vdo tiles untouched by default) ──
    // For rooms with transport === 'livekit' the tile CONTENT is a LiveKit
    // <video> track instead of a vdo iframe. Everything else — slots,
    // stingers, labels, WS-driven lifecycle — is byte-identical.
    let lkMode = false;
    let lkOverlayRoom = null;
    const lkTracks = new Map(); // identity → { video, audio }
    const lkTileEls = new Map(); // identity → video element awaiting a track

    // Seats can arrive over the WS BEFORE we know the room's transport (the
    // config fetch is async) — buffer them so a livekit room never renders
    // vdo iframes by racing. Falls back to vdo after 4s if config never loads.
    let transportKnown = false;
    const pendingSeats = [];
    function transportResolved() {
      if (transportKnown) return;
      transportKnown = true;
      while (pendingSeats.length) addVideoBox(pendingSeats.shift());
    }
    setTimeout(transportResolved, 4000);

    // ── Reveal gating: ONE transition owner per seat ────────────────────────
    // A seat reveals only when BOTH are true: its track is subscribed AND its
    // entry stinger has passed its reveal frame — whichever lands later. If
    // the stinger finishes first we HOLD (the designed seat frame stays up);
    // an empty video frame is never shown. The stinger is the only transition
    // on the entry path — no crossfade underneath it, ever.
    //
    // Non-entry paths (mid-session reconnect, track restart, guest toggling
    // their camera) must NEVER replay the entry stinger; they take the short
    // fallback fade instead. `revealed` on the record is what distinguishes
    // them: once a seat has revealed, every later track swap is non-entry.
    const lkReveal = new Map(); // identity → { stingerDone, trackReady, revealed, el }

    function revealRecord(identity) {
      if (!lkReveal.has(identity)) {
        lkReveal.set(identity, { stingerDone: false, trackReady: false, revealed: false, el: null });
      }
      return lkReveal.get(identity);
    }

    function maybeReveal(identity) {
      const r = lkReveal.get(identity);
      if (!r || r.revealed || !r.el) return;
      if (!(r.stingerDone && r.trackReady)) return; // hold — later of the two wins
      r.revealed = true;
      const box = r.el.closest('.tile');
      if (box) box.classList.remove('lk-holding');
      r.el.classList.add('lk-revealed');
    }

    /** Entry stinger passed its reveal frame for this seat. */
    function markStingerRevealPoint(identity) {
      const r = revealRecord(identity);
      r.stingerDone = true;
      maybeReveal(identity);
    }

    function lkAttach(identity) {
      const el = lkTileEls.get(identity);
      const tr = lkTracks.get(identity);
      if (!el || !tr) return;
      const r = revealRecord(identity);
      r.el = el;
      if (tr.video) tr.video.attach(el);
      if (tr.audio) {
        const a = tr.audio.attach();
        a.style.display = 'none';
        el.parentElement && el.parentElement.appendChild(a);
      }
      if (!tr.video) return;
      if (r.revealed) {
        // NON-ENTRY path: reconnect / track restart / camera toggle. The entry
        // stinger already played and must not replay — short crossfade only.
        el.classList.remove('lk-refade');
        void el.offsetWidth; // restart the animation
        el.classList.add('lk-refade');
        return;
      }
      r.trackReady = true;
      maybeReveal(identity);
    }

    async function initLivekitOverlay() {
      try {
        const cfg = await (await fetch(`/api/config?room=${encodeURIComponent(streamRoomId)}`)).json();
        sfxEnabled = cfg.stingerSounds !== false; // room master toggle
        if (cfg.transport !== 'livekit') {
          transportResolved(); // vdo room — flush any buffered seats as iframes
          return;
        }
        lkMode = true;
        transportResolved(); // livekit confirmed — buffered seats become <video> tiles
        lkLazy = cfg.lazyConnect || { enabled: false };
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = '/vendor/livekit-client.umd.js';
          s.onload = resolve;
          s.onerror = () => reject(new Error('livekit-client failed to load'));
          document.head.appendChild(s);
        });
        if (!lkLazy.enabled) {
          // LAZY_CONNECT=0 — today's exact behavior: connect on mount, stay up.
          console.log('[overlay] lazy connect DISABLED — legacy always-on mode');
          return lkConnect('flag-off');
        }
        // Lazy: no connection until the server says a seat is being bought.
        console.log('[overlay] lazy connect ON — idle until a guest arrives');
        setLkStatus('idle');
        startHeartbeat();
        startSignalFallback();
      } catch (err) {
        console.error('[overlay] LiveKit init failed:', err.message);
        setLkStatus('error');
      }
    }

    // ─── Lazy connect: the overlay holds a LiveKit connection ONLY while a
    // seat is being bought or occupied. Idle costs nothing. See
    // LIVEKIT-AUDIT.md — connect-on-mount with no teardown is what drained
    // 5,000 free minutes with nobody on camera.
    /** Per-browser-source id: stable across reloads, unique per source/tab. */
    /**
     * Per-browser-source id: STABLE ACROSS RELOADS, unique per source/tab.
     *
     * Both properties are load-bearing and they pull in opposite directions:
     *  - not stable across reloads → this page reloads itself on WS close, so
     *    every reload mints a new identity and STACKS another billed
     *    participant. That is the leak lazy-connect exists to prevent.
     *  - not unique per source → two overlays on one room evict each other,
     *    which is the black-OBS-tile bug.
     *
     * The fallback chain never trades the first for the second:
     *
     *  1. sessionStorage — survives reload, scoped to this source. Normal path.
     *  2. window.name — survives reload within the same window and needs no
     *     storage permission. This is the one that saves us if OBS's CEF has
     *     storage disabled.
     *  3. NO SUFFIX AT ALL. If neither works we deliberately fall back to the
     *     old room-scoped `overlay:<roomId>`. That reintroduces mutual
     *     eviction between two overlays — visible instantly as a black tile,
     *     and recoverable — rather than silently billing a new participant on
     *     every reload forever. Given the choice, take the loud failure.
     */
    function overlayInstanceId() {
      const mint = () => Math.random().toString(36).slice(2, 10);
      try {
        let id = sessionStorage.getItem('mc-overlay-instance');
        if (!id) {
          id = mint();
          sessionStorage.setItem('mc-overlay-instance', id);
        }
        return id;
      } catch { /* storage blocked — try window.name */ }

      try {
        const PREFIX = 'mc-overlay:';
        if (typeof window.name === 'string' && window.name.startsWith(PREFIX)) {
          const id = window.name.slice(PREFIX.length);
          if (id) return id;
        }
        const id = mint();
        window.name = PREFIX + id;
        // Only trust it if it actually stuck.
        if (window.name === PREFIX + id) {
          console.warn('[overlay] sessionStorage unavailable — using window.name for a reload-stable id');
          return id;
        }
      } catch { /* fall through */ }

      console.error(
        '[overlay] no reload-stable storage available. Falling back to a room-scoped identity: '
        + 'a second overlay on this room WILL disconnect this one. This is deliberate — the '
        + 'alternative silently bills a new participant on every reload.',
      );
      return '';
    }

    let lkLazy = { enabled: false };
    let lkState = 'idle';          // idle | waking | live | error
    let lkConnecting = false;
    let lkRetryMs = 0;
    let lkRetryTimer = null;
    let lkBeatTimer = null;
    let lkPollTimer = null;
    let lkIdentity = null;

    function setLkStatus(state) {
      lkState = state;
      const pin = document.getElementById('lk-status');
      if (pin) pin.dataset.state = state;
    }

    async function lkConnect(reason) {
      if (!lkMode || lkConnecting || lkOverlayRoom) return;
      lkConnecting = true;
      if (lkState !== 'live') setLkStatus('waking');
      try {
        // Token minted at WAKE time, every time. A token minted at OBS start
        // would be hours expired by the time someone actually joined.
        const tokRes = await fetch('/api/livekit/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // role:'overlay' → identity overlay:<roomId>:<instance>.
          //
          // The instance id lives in sessionStorage, which is exactly the
          // right scope: a RELOAD of this browser source keeps it (so the
          // reconnect still evicts its own stale predecessor — that is the
          // reload-churn fix), while a DIFFERENT source or tab gets its own
          // (so two overlays coexist instead of evicting each other).
          //
          // Purely stable per-room was wrong and shipped a real regression:
          // opening the overlay anywhere else — a second OBS source, a tab to
          // check it, a duplicated scene — silently kicked OBS off LiveKit and
          // the broadcast went black while tiles still rendered.
          body: JSON.stringify({ room: streamRoomId, role: 'overlay', instance: overlayInstanceId() }),
        });
        const tok = await tokRes.json();
        if (!tokRes.ok || !tok.token) throw new Error(tok.error || 'no token');
        lkIdentity = tok.identity || ('overlay:' + streamRoomId);
        const LK = window.LivekitClient;
        // adaptiveStream ON: tiles are 320x180 — without it the overlay
        // subscribed every guest's TOP simulcast layer (720p) and decoded it
        // in OBS's embedded Chromium while OBS encodes on the same CPU.
        // That was the "extremely laggy" guest video. Adaptive sizes the
        // subscription to the element, so tiles ride the low layer.
        lkOverlayRoom = new LK.Room({ adaptiveStream: true });
        lkOverlayRoom.on(LK.RoomEvent.TrackSubscribed, (track, pub, participant) => {
          const id = participant.identity;
          const entry = lkTracks.get(id) || {};
          if (track.kind === 'video') entry.video = track;
          if (track.kind === 'audio') entry.audio = track;
          lkTracks.set(id, entry);
          lkAttach(id);
        });
        lkOverlayRoom.on(LK.RoomEvent.ParticipantDisconnected, (p) => {
          lkTracks.delete(p.identity);
          // tile removal stays WS-driven (seat_removed → stinger out)
        });
        // EXTERNAL disconnect — evicted, network drop, or server close. Before
        // this handler existed, `lkOverlayRoom` stayed set to a dead Room and
        // lkConnect()'s `if (lkOverlayRoom) return` guard blocked every future
        // attempt: the source sat black forever while tiles kept rendering off
        // the WS. Clear the reference and reconnect if a guest still needs us.
        lkOverlayRoom.on(LK.RoomEvent.Disconnected, (reason) => {
          const why = String(reason ?? 'unknown');
          console.warn(`[overlay] LiveKit disconnected externally (${why})`);
          lkOverlayRoom = null;
          lkTracks.clear();
          setLkStatus('error');
          if (lkWanted) {
            console.log('[overlay] a guest still needs us — reconnecting');
            setTimeout(() => { if (lkWanted && !lkOverlayRoom) lkConnect('external-disconnect'); }, 1200);
          } else {
            setLkStatus('idle');
          }
        });
        await lkOverlayRoom.connect(tok.url, tok.token);
        lkRetryMs = 0;
        setLkStatus('live');
        beat(); // tell the server a billed session just opened
        console.log(`[overlay] LiveKit connected (${reason}) as ${lkIdentity}`);
      } catch (err) {
        console.error('[overlay] connect failed:', err.message);
        try { lkOverlayRoom && lkOverlayRoom.disconnect(); } catch { /* noop */ }
        lkOverlayRoom = null;
        setLkStatus('error');
        // Backoff retry — but only while something still wants us connected.
        lkRetryMs = Math.min(
          lkRetryMs ? lkRetryMs * 2 : (lkLazy.connectRetryBaseMs || 500),
          lkLazy.connectRetryMaxMs || 15000,
        );
        clearTimeout(lkRetryTimer);
        lkRetryTimer = setTimeout(() => {
          if (lkWanted) lkConnect('retry');
        }, lkRetryMs);
      } finally {
        lkConnecting = false;
      }
    }

    function lkDisconnect(reason) {
      clearTimeout(lkRetryTimer);
      lkRetryMs = 0;
      if (!lkOverlayRoom) { setLkStatus('idle'); return; }
      console.log(`[overlay] LiveKit disconnecting (${reason}) — minutes stop here`);
      try { lkOverlayRoom.disconnect(); } catch { /* already down */ }
      lkOverlayRoom = null;
      lkTracks.clear();
      setLkStatus('idle');
      beat();
    }

    /** Server-authoritative desire. Set by WS signal or the polling fallback. */
    let lkWanted = false;
    function applyDesired(desired, reason) {
      const want = desired === 'wake';
      if (want === lkWanted && (want ? !!lkOverlayRoom || lkConnecting : !lkOverlayRoom)) return;
      lkWanted = want;
      if (want) lkConnect(reason || 'signal');
      else lkDisconnect(reason || 'signal');
    }

    /** Heartbeat: proves the browser source is alive AND doubles as the
     *  polling fallback — the response carries the state we should be in, so
     *  a dead WS signal cannot strand the overlay disconnected. */
    async function beat() {
      if (!lkMode || !lkLazy.enabled) return;
      try {
        const res = await fetch('/api/livekit/overlay/beat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room: streamRoomId, lkState, identity: lkIdentity }),
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.desired) applyDesired(data.desired, 'heartbeat');
      } catch { /* offline — the next beat retries */ }
    }
    function startHeartbeat() {
      clearInterval(lkBeatTimer);
      lkBeatTimer = setInterval(beat, lkLazy.heartbeatIntervalMs || 15000);
      beat();
    }
    /** Slow safety poll in case BOTH the WS signal and a beat response are lost. */
    function startSignalFallback() {
      clearInterval(lkPollTimer);
      lkPollTimer = setInterval(() => {
        if (ws && ws.readyState === 1) return; // WS healthy — no need
        beat();
      }, lkLazy.signalPollMs || 4000);
    }

    // Teardown is UNCONDITIONAL — outside the flag. A LiveKit connection that
    // outlives its page is never correct in either mode, and this single line
    // is what the old overlay was missing.
    const hangUp = () => { try { lkOverlayRoom && lkOverlayRoom.disconnect(); } catch { /* noop */ } };
    window.addEventListener('pagehide', hangUp);
    window.addEventListener('beforeunload', hangUp);

    initLivekitOverlay();

    // ─── Creator bounty: proof-of-broadcast watermark ─────────────────────
    // Entirely inert unless the overlay URL carries ?bounty=<airSessionId>.
    // Rotation is SERVER-authoritative: we poll for the code rather than
    // running a local timer, so a client whose clock is wrong (or edited)
    // cannot mint or extend its own codes.
    (function bountyWatermark() {
      const airSessionId = new URLSearchParams(location.search).get('bounty');
      if (!airSessionId) return; // normal room — renders exactly as before

      const badge = document.getElementById('bounty-badge');
      const codeEl = document.getElementById('bounty-code');
      let reportedTooSmall = null; // null = nothing reported yet
      let rotateMs = 60000;

      /**
       * EARLY WARNING ONLY — this is not enforcement, and must not be
       * described as detecting a shrunken badge.
       *
       * It measures the badge against the BROWSER SOURCE canvas. OBS renders
       * the page at its configured resolution and then scales that texture
       * into the scene; a page cannot observe its own scene transform. So
       * this catches a tiny browser-source resolution and nothing else — a
       * source scaled down in the scene looks completely normal from here.
       *
       * Enforcement lives in the verifier, which measures the code's rendered
       * height in the ACTUAL captured broadcast frame and fails any sample
       * below the floor even when the code was found. That is where the money
       * is decided. This check exists so an honest streamer catches a
       * misconfiguration in OBS instead of discovering it in an unpaid bounty.
       */
      function checkSize() {
        const r = badge.getBoundingClientRect();
        const h = r.height;
        const canvasH = window.innerHeight || 1;
        const minPx = (window.__bountyCfg && window.__bountyCfg.badgeMinHeightPx) || 18;
        const minRatio = (window.__bountyCfg && window.__bountyCfg.badgeMinHeightRatio) || 0.03;
        const tooSmall = h < minPx || (h / canvasH) < minRatio;
        return { tooSmall, height: +h.toFixed(1), canvasH, ratio: +(h / canvasH).toFixed(4) };
      }

      async function report(tooSmall, detail) {
        if (reportedTooSmall === tooSmall) return; // only on change
        reportedTooSmall = tooSmall;
        try {
          await fetch(`/api/bounty/air-session/${encodeURIComponent(airSessionId)}/badge`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tooSmall, detail }),
          });
        } catch { /* next poll retries */ }
      }

      async function poll() {
        try {
          const res = await fetch(`/api/bounty/air-session/${encodeURIComponent(airSessionId)}/code`);
          if (!res.ok) { badge.classList.remove('show'); return; }
          const data = await res.json();
          if (data.rotateMs) rotateMs = data.rotateMs;

          if (!data.code) {
            // No code exists right now. Either the badge is flagged, or —
            // the normal case — NO CLIP IS PLAYING. Codes only exist during
            // clip playback, so a parked overlay legitimately shows nothing
            // and earns nothing.
            codeEl.textContent = data.badgeTooSmall ? 'BADGE TOO SMALL — NOT EARNING' : '';
            badge.classList.toggle('too-small', !!data.badgeTooSmall);
            badge.classList.toggle('show', !!data.badgeTooSmall);
            return;
          }

          badge.classList.remove('too-small');
          badge.classList.add('show');
          codeEl.textContent = data.code;

          // Measure AFTER paint so the rect reflects the rendered code.
          requestAnimationFrame(() => {
            const size = checkSize();
            if (size.tooSmall) {
              codeEl.textContent = 'BADGE TOO SMALL — NOT EARNING';
              badge.classList.add('too-small');
            }
            void report(size.tooSmall, size);
          });
        } catch {
          /* server unreachable — keep the last code on screen rather than
             blanking the broadcast; the next poll recovers. */
        }
      }

      fetch('/api/bounty/config')
        .then((r) => (r.ok ? r.json() : null))
        .then((cfg) => { if (cfg) window.__bountyCfg = cfg; })
        .catch(() => {})
        .finally(() => {
          poll();
          // Poll faster than rotation so a new code appears promptly.
          setInterval(poll, Math.max(5000, rotateMs / 4));
          window.addEventListener('resize', () => {
            requestAnimationFrame(() => {
              const s = checkSize();
              void report(s.tooSmall, s);
            });
          });
        });
    })();

    ws.onopen = () => {
      console.log('Overlay connected to server');
      if (ws.readyState === 1) {
        // role:'overlay' — MegaChats only play while an overlay is rendering
        // the room (otherwise clips would burn into the void).
        ws.send(JSON.stringify({ type: 'subscribe_room', room: streamRoomId, role: 'overlay' }));
      }
    };

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      switch (msg.type) {
        // Lazy connect: the server decides when we hold a LiveKit connection.
        case 'lk_activity':
          applyDesired(msg.state === 'wake' ? 'wake' : 'sleep', msg.reason || 'ws');
          break;
        case 'initial_state':
          // Server only sends seats that are already live (camera approved).
          msg.seats.forEach(seat => addVideoBox(seat));
          break;
        case 'seat_added':
          // Broadcast only AFTER camera_ready, so the tile pops in live.
          addVideoBox(msg.seat);
          break;
        case 'seat_removed':
          removeVideoBox(msg.seatId);
          break;
        case 'seat_pinned': {
          const box = videoBoxes.get(msg.seatId);
          if (box) box.classList.toggle('pinned', !!msg.pinned);
          break;
        }
        case 'letter_play':
          addLetterBox(msg.letter);
          break;
        case 'letter_end':
          removeVideoBox('letter:' + msg.letterId);
          break;
      }
    };

    // Stinger registry — class + duration + optional fx overlay. Anything not
    // listed (or absent) falls back to the original default animations.
    const FLY_INS = {
      storm:    { cls: 'in-storm',    ms: 1400, fx: 'fx-storm' },
      proroll:  { cls: 'in-proroll',  ms: 900,  fx: 'fx-proroll' },
      callme:   { cls: 'in-callme',   ms: 1200, fx: 'fx-callme' },
      breaking: { cls: 'in-breaking', ms: 1300, fx: 'fx-breaking' },
      wildin:   { cls: 'in-wildin',   ms: 1400, fx: 'fx-scanline' },
    };
    const FLY_OUTS = {
      crt:     { cls: 'out-crt',     ms: 800 },
      crumble: { cls: 'out-crumble', ms: 1200 },
      zapped:  { cls: 'out-zapped',  ms: 1100 },
      wildout: { cls: 'out-wildout', ms: 1000 },
    };

    function addVideoBox(seat) {
      if (!transportKnown) { pendingSeats.push(seat); return; }
      if (videoBoxes.has(seat.id)) return;
      if (liveCount() >= MAX_SEATS) return; // CHANGE 2 — never render a 4th

      const fin = FLY_INS[seat.flyIn] || null;
      const box = document.createElement('div');
      box.className = 'tile ' + (fin ? fin.cls : 'joining');
      box.dataset.seatId = seat.id;
      box.dataset.flyOut = (seat.flyOut && FLY_OUTS[seat.flyOut]) ? seat.flyOut : '';
      box.style.width = TILE_W + 'px';
      box.style.height = TILE_H + 'px';
      // Place it in its final slot BEFORE insertion so it doesn't slide on add.
      box.style.top = (liveCount() * (TILE_H + GAP)) + 'px';

      // Tile CONTENT: LiveKit <video> for livekit rooms, vdo iframe otherwise.
      let content;
      if (lkMode) {
        content = document.createElement('video');
        content.autoplay = true;
        content.playsInline = true;
        content.style.cssText = 'width:100%;height:100%;object-fit:cover;background:transparent;';
        lkTileEls.set('seat:' + seat.id, content);
        lkAttach('seat:' + seat.id); // track may have arrived before the seat broadcast
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = buildOverlayViewUrl(seat.viewUrl);
        iframe.allow = 'autoplay; camera; microphone';
        iframe.setAttribute('allowtransparency', 'true');
        iframe.style.background = 'transparent';
        iframe.style.backgroundColor = 'transparent';
        injectVdoOverlayStyles(iframe);
        content = iframe;
      }

      const flash = document.createElement('div');
      flash.className = 'crt-flash';

      const label = document.createElement('div');
      label.className = 'username-label';
      label.textContent = seat.username;

      const pinBadge = document.createElement('div');
      pinBadge.className = 'pin-badge';
      pinBadge.textContent = '📌 CO-HOST';
      if (seat.pinned) box.classList.add('pinned');

      box.appendChild(content);
      box.appendChild(flash);
      box.appendChild(label);
      box.appendChild(pinBadge);

      // Optional stinger fx overlay (clouds / light bar / rings / banner /
      // scan sweep) — self-removing, never outlives the entrance.
      if (fin && fin.fx) {
        const fx = document.createElement('div');
        fx.className = 'stinger-fx ' + fin.fx;
        box.appendChild(fx);
        setTimeout(() => fx.remove(), fin.ms + 120);
      }
      stage.appendChild(box);

      videoBoxes.set(seat.id, box);
      relayout();
      playStinger('in', seat.flyIn || 'default');

      // Lazy connect: hold this tile's video until its track lands. The seat
      // FRAME is already on screen (it is DOM and costs nothing); only the
      // texture waits. Reveal fires at the stinger's reveal frame or at track
      // arrival, whichever is LATER — so a slow connect hides inside an
      // animation that was playing anyway, and an empty video frame is never
      // shown. Entry keeps a single transition owner: the stinger.
      if (lkMode) {
        const identity = 'seat:' + seat.id;
        const rec = revealRecord(identity);
        rec.el = box.querySelector('video');
        box.classList.add('lk-holding');
        const revealAt = fin ? fin.ms : JOIN_MS;
        setTimeout(() => markStingerRevealPoint(identity), revealAt);
        if (lkTracks.get(identity)) lkAttach(identity); // track beat us here
      }

      // Drop the entrance class once it finishes (so it won't replay).
      const inCls = fin ? fin.cls : 'joining';
      setTimeout(() => box.classList.remove(inCls), fin ? fin.ms : JOIN_MS);
    }

    // Letter tile — same slot/stinger machinery as a seat, but the content is
    // a one-shot <video> clip streamed from the server instead of a live cam.
    function addLetterBox(letter) {
      const key = 'letter:' + letter.id;
      if (videoBoxes.has(key)) return;
      if (liveCount() >= MAX_SEATS) return; // server schedules around this; belt+braces

      const fin = FLY_INS[letter.flyIn] || null;
      const box = document.createElement('div');
      box.className = 'tile ' + (fin ? fin.cls : 'joining');
      box.dataset.seatId = key;
      box.dataset.flyOut = (letter.flyOut && FLY_OUTS[letter.flyOut]) ? letter.flyOut : '';
      box.style.width = TILE_W + 'px';
      box.style.height = TILE_H + 'px';
      box.style.top = (liveCount() * (TILE_H + GAP)) + 'px';

      const video = document.createElement('video');
      video.src = letter.mediaUrl;
      video.autoplay = true;
      video.playsInline = true;
      video.style.cssText = 'width:100%;height:100%;object-fit:cover;background:#000;';
      // When the clip finishes early (or stalls), fly out without waiting for
      // the server's letter_end.
      video.addEventListener('ended', () => removeVideoBox(key));

      const flash = document.createElement('div');
      flash.className = 'crt-flash';

      const label = document.createElement('div');
      label.className = 'username-label';
      label.textContent = '📼 ' + letter.username;

      box.appendChild(video);
      box.appendChild(flash);
      box.appendChild(label);

      if (fin && fin.fx) {
        const fx = document.createElement('div');
        fx.className = 'stinger-fx ' + fin.fx;
        box.appendChild(fx);
        setTimeout(() => fx.remove(), fin.ms + 120);
      }
      stage.appendChild(box);
      videoBoxes.set(key, box);
      relayout();
      playStinger('in', letter.flyIn || 'default');
      const inCls = fin ? fin.cls : 'joining';
      setTimeout(() => box.classList.remove(inCls), fin ? fin.ms : JOIN_MS);
    }

    function removeVideoBox(seatId) {
      lkTileEls.delete('seat:' + seatId);
      const box = videoBoxes.get(seatId);
      if (!box || box.classList.contains('leaving')) return;

      // CHANGE 5 — play the exit stinger first; the tile keeps its slot so the
      // others don't move yet. `.leaving` marks it, out-* animates it.
      const fout = FLY_OUTS[box.dataset.flyOut] || null;
      box.classList.add('leaving', fout ? fout.cls : 'out-default');
      playStinger('out', box.dataset.flyOut || 'default');

      setTimeout(() => {
        box.remove();
        videoBoxes.delete(seatId);
        // CHANGE 3 — now reflow: remaining tiles slide up to close the gap.
        relayout();
      }, fout ? fout.ms : CRT_MS);
    }

    // Count tiles that are actually occupying a slot (exclude ones mid-leave).
    function liveCount() {
      let n = 0;
      for (const box of videoBoxes.values()) {
        if (!box.classList.contains('leaving')) n++;
      }
      return n;
    }

    // Position every live tile in a top-to-bottom stack and shrink-wrap #stage.
    function relayout() {
      let i = 0;
      for (const box of videoBoxes.values()) {
        if (box.classList.contains('leaving')) continue; // keeps its current spot
        box.style.top = (i * (TILE_H + GAP)) + 'px';
        i++;
      }
      stage.style.height = i > 0 ? (i * (TILE_H + GAP) - GAP) + 'px' : '0px';
    }

    // (The old 10s-block countdown chip is gone: per-second metering made the
    // expiresAt timer meaningless on the broadcast layer.)

    // Test hook for automated gates — lets a driver inject/remove fake seats
    // without a WebSocket round-trip. Not used by production code paths.
    window.OverlayTest = {
      addSeat: (seat) => addVideoBox(seat),
      removeSeat: (seatId) => removeVideoBox(seatId),
      count: () => videoBoxes.size,
    };

    // ─── CHANGE 6 — best-effort SFX ──────────────────────────────────────────
    // Short synthesized blips via WebAudio (no external assets). CRITICAL: this
    // is best-effort only. Browser autoplay policy and headless OBS browser
    // sources may block audio with no user gesture / no audio device — every
    // call is wrapped so a blocked or rejected sound NEVER throws or blocks the
    // animation. If audio can't play, the visuals still run.
    let audioCtx = null;
    function getCtx() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        return audioCtx;
      } catch { return null; }
    }
    // ═══ Stinger SFX — synthesized per stinger, timed to the animations. ═══
    // WebAudio recipes (royalty-free by construction, no assets to load).
    // Master toggle per room: stingerSounds (dashboard, default on). Volumes
    // stay modest — this plays under live commentary. OBS captures it when
    // the browser source has "Control audio via OBS" enabled.
    let sfxEnabled = true; // refined from /api/config at boot
    window.__sfxPlays = []; // diagnostic breadcrumb (gates read this)
    const MASTER_VOL = 0.55;

    let _noiseBuf = null;
    function noiseBuf(ctx) {
      if (_noiseBuf) return _noiseBuf;
      const b = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      _noiseBuf = b;
      return b;
    }
    function tone(ctx, { type = 'sine', f0, f1, t, dur, peak = 0.2 }) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * MASTER_VOL, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ctx.destination);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    function noise(ctx, { t, dur, peak = 0.25, type = 'lowpass', f0 = 800, f1, q = 0.8 }) {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf(ctx);
      src.loop = true;
      const flt = ctx.createBiquadFilter();
      flt.type = type;
      flt.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) flt.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      flt.Q.value = q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * MASTER_VOL, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(flt).connect(g).connect(ctx.destination);
      src.start(t);
      src.stop(t + dur + 0.05);
    }

    // Each recipe is cut to its animation's beats (documented next to the
    // keyframes above): storm cracks land on the two lightning strikes,
    // breaking's thud on the banner slam, crt's hiss on the white flash…
    const SFX = {
      'in:default':  (x, t) => { tone(x, { f0: 660, t, dur: 0.18, peak: 0.22 }); tone(x, { f0: 990, t: t + 0.12, dur: 0.18, peak: 0.22 }); },
      'in:storm':    (x, t) => { noise(x, { t, dur: 1.1, peak: 0.16, f0: 220, f1: 120 });
                                 noise(x, { t: t + 0.70, dur: 0.16, peak: 0.5, type: 'highpass', f0: 800 });
                                 noise(x, { t: t + 0.90, dur: 0.24, peak: 0.55, type: 'highpass', f0: 600 }); },
      'in:proroll':  (x, t) => { noise(x, { t, dur: 0.7, peak: 0.3, type: 'bandpass', f0: 300, f1: 2400, q: 1.4 }); },
      'in:callme':   (x, t) => { tone(x, { type: 'square', f0: 1180, t, dur: 0.09, peak: 0.15 });
                                 tone(x, { type: 'square', f0: 1180, t: t + 0.14, dur: 0.09, peak: 0.15 });
                                 tone(x, { f0: 420, f1: 660, t: t + 0.62, dur: 0.22, peak: 0.24 }); },
      'in:breaking': (x, t) => { tone(x, { type: 'sawtooth', f0: 196, t, dur: 0.22, peak: 0.18 });
                                 tone(x, { type: 'sawtooth', f0: 262, t: t + 0.2, dur: 0.22, peak: 0.18 });
                                 noise(x, { t: t + 0.5, dur: 0.28, peak: 0.5, f0: 150 }); },
      'in:wildin':   (x, t) => { for (let i = 0; i < 5; i++) noise(x, { t: t + i * 0.17, dur: 0.06, peak: 0.28, type: 'highpass', f0: 1200 });
                                 tone(x, { type: 'square', f0: 880, f1: 220, t: t + 0.85, dur: 0.3, peak: 0.16 }); },
      'out:default': (x, t) => { tone(x, { f0: 520, f1: 300, t, dur: 0.3, peak: 0.22 }); },
      'out:crt':     (x, t) => { tone(x, { f0: 600, f1: 55, t, dur: 0.55, peak: 0.3 });
                                 noise(x, { t: t + 0.42, dur: 0.14, peak: 0.4, type: 'highpass', f0: 2200 }); },
      'out:crumble': (x, t) => { [0, 0.28, 0.6].forEach((at, i) => noise(x, { t: t + at, dur: 0.2, peak: 0.36 - i * 0.07, f0: 280 })); },
      'out:zapped':  (x, t) => { tone(x, { type: 'sawtooth', f0: 1400, f1: 70, t, dur: 0.5, peak: 0.24 });
                                 noise(x, { t, dur: 0.5, peak: 0.18, type: 'highpass', f0: 2600 }); },
      'out:wildout': (x, t) => { noise(x, { t, dur: 0.35, peak: 0.4, type: 'highpass', f0: 1600 });
                                 tone(x, { f0: 440, t: t + 0.42, dur: 0.35, peak: 0.18 }); },
    };

    function playStinger(kind, name) {
      if (!sfxEnabled) return;
      const key = SFX[`${kind}:${name}`] ? `${kind}:${name}` : `${kind}:default`;
      try {
        const ctx = getCtx();
        if (!ctx) return;
        if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
        SFX[key](ctx, ctx.currentTime + 0.01);
        window.__sfxPlays.push(key);
        console.log('[sfx]', key);
      } catch { /* audio is purely best-effort */ }
    }

    ws.onerror = (err) => console.error('WebSocket error:', err);
    ws.onclose = () => {
      console.log('Disconnected from server, reconnecting...');
      setTimeout(() => location.reload(), 3000);
    };
  </script>
</body>
</html>
